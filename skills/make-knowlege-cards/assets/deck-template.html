<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --ink: #1f2328; --muted: #646b73;
    --line: #ddd6c8; --accent: #2f5d50; --soft: #e9f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17191c; --card: #202328; --ink: #e8e6e1; --muted: #a0a6ad;
      --line: #343941; --accent: #7fc4ae; --soft: #26302d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header, main { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  header { padding-top: 40px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
  h1 { font-family: Georgia, "Noto Serif", "Songti SC", serif; font-size: 2rem; line-height: 1.2; margin: 0 0 6px; }
  #deck-meta { color: var(--muted); margin: 0; font-size: .92rem; overflow-wrap: anywhere; }
  button {
    font: inherit; font-size: .88rem; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 20px; padding-top: 26px; padding-bottom: 60px; align-items: start;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--accent);
    border-radius: 10px; padding: 18px 20px 16px; break-inside: avoid;
  }
  .num { font-size: .76rem; letter-spacing: .08em; color: var(--muted); }
  h2 { font-family: Georgia, "Noto Serif", "Songti SC", serif; font-size: 1.28rem; line-height: 1.25; margin: 4px 0 14px; }
  .label { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 3px; }
  .part { margin: 0 0 14px; }
  .part:last-child { margin-bottom: 0; }
  .part p { margin: 0; overflow-wrap: anywhere; }
  .knowledge { background: var(--soft); border-radius: 8px; padding: 10px 14px; }
  .knowledge p { font-weight: 600; }
  .example { border-left: 3px solid var(--accent); padding-left: 12px; }
  .example p { font-size: .95rem; }
  @media print {
    :root { --bg: #fff; --card: #fff; --ink: #000; --muted: #444; --line: #bbb; --accent: #1d4a3e; --soft: #eef3f0; }
    button { display: none; }
    header { padding-top: 0; }
    main { grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 0; }
    body { font-size: 10.5pt; }
    .knowledge { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="deck-title"></h1>
    <p id="deck-meta"></p>
  </div>
  <button id="print" type="button"></button>
</header>
<main id="grid"></main>
<script id="deck-data" type="application/json">__DECK_JSON__</script>
<script>
(function () {
  var deck = JSON.parse(document.getElementById('deck-data').textContent);
  var ui = {
    en: { cards: 'cards', card: 'Card', print: 'Print' },
    de: { cards: 'Karten', card: 'Karte', print: 'Drucken' },
    zh: { cards: '张卡片', card: '卡片', print: '打印' }
  };
  var t = ui[String(deck.lang || 'en').slice(0, 2).toLowerCase()] || ui.en;
  var lab = deck.labels;

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function part(cls, label, text) {
    var d = el('div', 'part ' + cls);
    d.appendChild(el('span', 'label', label));
    d.appendChild(el('p', '', text));
    return d;
  }

  document.getElementById('deck-title').textContent = deck.title;
  var meta = deck.cards.length + ' ' + t.cards;
  if (deck.source) meta += ' · ' + lab.source + ': ' + deck.source;
  document.getElementById('deck-meta').textContent = meta;

  var grid = document.getElementById('grid');
  deck.cards.forEach(function (c, i) {
    var a = el('article', 'card');
    a.appendChild(el('div', 'num', t.card + ' ' + (i + 1) + ' / ' + deck.cards.length));
    a.appendChild(el('h2', '', c.title));
    a.appendChild(part('knowledge', lab.knowledge, c.knowledge));
    if (c.introduction) a.appendChild(part('introduction', lab.introduction, c.introduction));
    if (c.example) a.appendChild(part('example', lab.example, c.example));
    grid.appendChild(a);
  });

  var printBtn = document.getElementById('print');
  printBtn.textContent = t.print;
  printBtn.addEventListener('click', function () { window.print(); });
})();
</script>
</body>
</html>
